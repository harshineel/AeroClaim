server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: aeroclaim-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aeroclaim}
    username: ${DB_USER:aeroclaim}
    password: ${DB_PASSWORD:aeroclaim}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null

# Camunda 8 self-managed (lightweight docker compose: gRPC 26500, REST 8080, unprotected API)
camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    auth:
      method: none

aeroclaim:
  # Same values the connector runtime receives as {{secrets.FLIGHT_API_KEY}} / {{secrets.PAYMENT_API_KEY}}
  security:
    flight-api-key: ${FLIGHT_API_KEY:flight-demo-key}
    payment-api-key: ${PAYMENT_API_KEY:payment-demo-key}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  default-sla: ${DEFAULT_SLA:PT24H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
